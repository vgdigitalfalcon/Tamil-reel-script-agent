# Use Supabase (or any hosted Postgres) instead of the bundled db container.
#   docker compose -f docker-compose.yml -f docker-compose.supabase.yml up -d --build
# With HTTPS on a server, add -f docker-compose.prod.yml as well.
#
# Requires in .env:
#   DATABASE_URL=postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
# Use the "Session pooler" string from Supabase -> Connect (works over IPv4; direct db.<ref>.supabase.co is IPv6-only).

services:
  db:
    # Bundled Postgres is not started in this mode.
    profiles: ["local-db"]

  api:
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your Supabase session pooler connection string in .env}
    depends_on: !reset {}
